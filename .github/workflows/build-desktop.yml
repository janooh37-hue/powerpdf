name: Desktop packaging feasibility

on:
  push:
    branches: [gui-packaging, gui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: windows-x64
            arch: X64
          - runner: macos-15
            label: macos-arm64
            arch: ARM64
          - runner: macos-15-intel
            label: macos-x64
            arch: X64
          - runner: ubuntu-22.04
            label: linux-x64
            arch: X64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13.11'
          enable-cache: true
      - name: Assert native architecture
        run: |
          test '${{ runner.arch }}' = '${{ matrix.arch }}'
          uv run --no-project python -c 'import platform; print(platform.platform(), platform.machine())'
      - name: Linux freezer prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libfontconfig1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - name: Build complete native helper closure and installers
        run: >-
          uv run --no-project --with pyside6==6.8.3 --with pyinstaller==6.17.0
          --with pypdfium2==4.30.0 --with pillow==11.3.0
          python packaging/build-desktop.py
      - name: Runtime resolution tests
        run: uv run --no-project --with pytest==9.0.2 python -m pytest -q test_runtime.py
      - name: Smoke installed or mounted artifacts
        run: uv run --no-project python packaging/smoke/install-artifacts.py
      - name: Upload installer outputs and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packaging-${{ matrix.label }}
          path: |
            dist/*setup.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*source.tar.*
            dist/native-linkage.txt
            dist/artifact-sizes.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload screenshots and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ matrix.label }}
          path: build/evidence/
          if-no-files-found: warn
          retention-days: 14
