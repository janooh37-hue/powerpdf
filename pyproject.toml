[project]
name = "powerpdf"
version = "0.8.0"
description = "Local PDF tools with a shared engine for desktop, terminal and command-line workflows"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pypdf>=6",
    "pypdfium2>=4",
    "PySide6==6.10.3",
    "platformdirs>=4.4",
    "send2trash>=2.1.0",
    "textual>=8",
    "textual-image>=0.14",
]

[project.scripts]
powerpdf = "powerpdf_cli:main"
pdfsplit = "pdf_split:main"
pdfmerge = "pdf_merge:main"
pdfcompress = "pdf_compress:main"
pdfimage = "pdf_image:main"

[project.gui-scripts]
powerpdf-gui = "powerpdf_gui:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["powerpdf", "powerpdf_cli", "pdf_runtime", "pdf_merge", "pdf_split", "pdf_compress", "pdf_image"]
packages = ["powerpdf_core", "powerpdf_gui"]

[tool.setuptools.data-files]
"share/powerpdf/assets" = ["assets/powerpdf.png"]
"share/powerpdf/assets/fonts" = [
    "assets/fonts/*.ttf",
    "assets/fonts/NotoSans-OFL.txt",
    "assets/fonts/NotoSansArabic-OFL.txt",
    "assets/fonts/SOURCES.json",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5",
]

[tool.pytest.ini_options]
qt_api = "pyside6"
